services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promo_radar
      POSTGRES_USER: promo_radar
      POSTGRES_PASSWORD: promo_radar
    ports:
      - "5432:5432"
    volumes:
      - promo_radar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo_radar -d promo_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://promo_radar:promo_radar@db:5432/promo_radar
      APP_TIMEZONE: America/Toronto
      JOB_TOKEN: ${JOB_TOKEN:-local-development-token}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  promo_radar_postgres:
