<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Promo Radar{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <header class="masthead">
    <div>
      <a class="wordmark" href="/">Promo Radar</a>
      <p class="strapline">GTA attention desk / observable signals only</p>
    </div>
    <nav aria-label="Main navigation">
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Top 10</a>
      <a href="/scoreboard" {% if request.url.path == '/scoreboard' %}aria-current="page"{% endif %}>Scoreboard</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Promo Radar / Phase B</span>
    <span>Measured movement, human judgment later.</span>
  </footer>
</body>
</html>
