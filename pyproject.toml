[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promo-radar"
version = "0.1.0"
description = "Detect emerging GTA news topics from observable signals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "feedparser>=6.0.11,<7",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.36,<3",
    "truststore>=0.10,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI uses Depends and Query in function signatures.
